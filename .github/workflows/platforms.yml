name: Platform boundaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev
      - name: Headless tests without native hardware or audio
        run: cargo +1.93.1 test --workspace --no-default-features --locked
      - name: RTL boundary tests without attached hardware
        run: cargo +1.93.1 test -p sdr-devices --features rtl --locked
      - name: Desktop compile
        run: cargo +1.93.1 check -p sdr-app --features desktop --locked
      - name: Headless tracing compile
        run: cargo +1.93.1 check -p sdr-app --no-default-features --features trace --locked
  portable-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.93.1 check -p sdr-core -p sdr-dsp --target wasm32-unknown-unknown --locked
