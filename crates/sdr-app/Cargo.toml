[package]
name = "sdr-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sdr-core.workspace = true
sdr-dsp.workspace = true
sdr-devices.workspace = true
bevy = { version = "=0.18.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_render", "bevy_window", "bevy_winit", "bevy_log", "multi_threaded", "sysinfo_plugin", "x11", "png", "bevy_gilrs", "serialize"], optional = true }
bevy_egui = { version = "=0.39.1", default-features = false, features = ["render", "default_fonts"], optional = true }
cpal = { version = "=0.17.3", optional = true }
ringbuf = { version = "0.4.8", optional = true }
tracing = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
csv = "1.4.0"
midir = { version = "0.11.0", optional = true }
directories = "6.0.0"
serde_json = "1.0"
mfsk-core = { version = "=0.11.0", default-features = false, features = ["std", "ft8", "ft4", "fft-rustfft"] }
hound = "3.5.1"

[features]
default = ["rtl-rust"]
rtl = ["sdr-devices/rtl"]
rtl-rust = ["rtl", "sdr-devices/rtl-rust"]
gui = ["dep:bevy", "dep:bevy_egui"]
audio = ["dep:cpal", "dep:ringbuf", "dep:windows"]
desktop = ["gui", "audio", "rtl-rust", "midi", "qmx", "ic705"]
ic705 = ["audio", "sdr-devices/cat"]
qmx = ["audio", "sdr-devices/cat"]
trace = ["dep:tracing"]
perfetto = ["desktop", "trace", "bevy/trace_chrome"]
midi = ["dep:midir"]


[[example]]
name = "qmx_receive_probe"
required-features = ["qmx"]

[[example]]
name = "ic705_receive_probe"
required-features = ["ic705"]

[[example]]
name = "ic705_tx_probe"
required-features = ["ic705"]

[[example]]
name = "rtl_backend_probe"
required-features = ["rtl-rust"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
