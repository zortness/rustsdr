[workspace]
members = ["crates/sdr-core", "crates/sdr-dsp", "crates/sdr-devices", "crates/sdr-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
sdr-core = { path = "crates/sdr-core" }
sdr-dsp = { path = "crates/sdr-dsp" }
sdr-devices = { path = "crates/sdr-devices", default-features = false }

[profile.dev.package.sdr-dsp]
opt-level = 3

[profile.dev.package.sdr-devices]
opt-level = 3

[profile.dev.package.mfsk-core]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
